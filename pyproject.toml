[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tanita-synchro"
version = "0.1.0"
description = "Copy MyTanita body composition measurements to Garmin Connect."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Michał Kaftański" }]
keywords = ["tanita", "mytanita", "garmin", "body composition", "weight", "scale", "sync"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
]
dependencies = [
    "garminconnect>=0.3.0",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/kaftee/tanita-synchro"
Documentation = "https://github.com/kaftee/tanita-synchro/blob/main/docs/usage.md"
Changelog = "https://github.com/kaftee/tanita-synchro/blob/main/CHANGELOG.md"
Issues = "https://github.com/kaftee/tanita-synchro/issues"

[project.scripts]
tanita-synchro = "tanita_synchro.cli:main"

[tool.setuptools]
packages = ["tanita_synchro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
